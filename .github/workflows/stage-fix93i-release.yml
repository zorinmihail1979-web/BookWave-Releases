name: Update Fix93i draft release description

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-fix93i-release.yml'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updated tester-friendly release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Edit the existing draft without replacing/deleting its APK asset.
          gh release edit fix93i \
            --title "BookWave Fix93i — Обновление ленты и уведомлений" \
            --notes-file RELEASE_NOTES_FIX93I.md
          gh release view fix93i --json name,isDraft,assets \
            --jq '{name: .name, draft: .isDraft, assets: [.assets[].name]}'
